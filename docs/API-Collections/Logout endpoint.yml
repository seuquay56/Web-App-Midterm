  docs: |-

    ### `POST /api/logout`
    Revokes the current user's Sanctum access token.

    **Resposnses**
    - **200 OK**
    ```json
    {
      "message": "Logged out successfully."
    }
    ```
    - **401 Unauthorized**
    ```json
    {
      "message": "Unauthenticated."
    }
    ```
