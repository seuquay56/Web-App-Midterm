  http:
    method: POST
    url: http://localhost:8000/api/logout
    headers:
      - name: Accept
        value: application/json
      - name: Authorization
        value: Bearer YOUR_SANCTUM_TOKEN
    auth: inherit

  runtime:
    assertions:
      - expression: res.status
        operator: eq
