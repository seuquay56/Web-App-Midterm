docs: |-
  info:
    name: Create Note Endpoint
    type: http
    seq: 4

  http:
    method: POST
    url: http://localhost:8000/api/notes
    headers:
      - name: Content-Type
        value: application/json
      - name: Authorization
        value: Bearer YOUR_SANCTUM_TOKEN
    body:
      type: json
      data: |-
        {
          "title": "New note title",
          "content": "New note content"
        }
    auth: inherit

  runtime:
    assertions:
      - expression: res.status
        operator: eq
        value: "201"

  settings:
    encodeUrl: true
    timeout: 0
    followRedirects: true
    maxRedirects: 5
    forwardAuthorizationHeader: true

  docs: |-

    ### `POST /api/notes`
    Creates a new note belonging to the authenticated user.

    **Responses**
    - **201 Created**
    ```json
    {
      "id": 2,
      "user_id": 3,
      "title": "New note title",
      "content": "New note content",
      "created_at": "2026-11-25T16:00:00.000000Z",
      "updated_at": "2026-11-25T16:00:00.000000Z"
    }
    ```
    - **401 Unauthorized**
    ```json
    {
      "message": "Unauthenticated."
    }
    ```
    - **422 Unprocessable Entity**
    ```json
    {
      "message": "The title field is required. (and 1 more error)",
      "errors": {
        "title": [
          "The title field is required."
        ],
        "content": [
          "The content field is required."
        ]
      }
    }
    ```
