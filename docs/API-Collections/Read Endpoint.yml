info:
  name: Read Notes Endpoint
  type: http
  seq: 2

http:
  method: GET
  url: http://localhost:8000/api/notes
  headers:
    - name: Authorization
      value: Bearer YOUR_SANCTUM_TOKEN
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-

  ### `GET /api/notes`
  Returns all notes belonging to the currently authenticated user.

  **Responses**
  * **200 OK**
  ```json
  [
    {
      "id": 1,
      "user_id": 1,
      "title": "First note",
      "content": "Note content here",
      "created_at": "2026-01-01 00:00:00",
      "updated_at": "2026-01-01 00:00:00"
    }
  ]