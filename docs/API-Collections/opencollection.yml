opencollection: 1.0.0

info:
  name: API-Collections
config:
  proxy:
    inherit: true
    config:
      protocol: http
      hostname: ""
      port: ""
      auth:
        username: ""
        password: ""
      bypassProxy: ""

docs:
  content: |-
    
    ## Endpoints Overview

    | Method | Endpoint | Auth | Status Codes |
    | :--- | :--- | :--- | :--- |
    | `GET` | `/api/health` | No | `200`, `503` |
    | `POST` | `/api/register` | No | `201`, `422` |

    ## Refer to each endpoints docs for more details on request/response.
  type: text/markdown
bundled: false
extensions:
  bruno:
    ignore:
      - node_modules
      - .git
